<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="refresh" content="300">
<title>ライブダッシュボード - 準備中</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
<style>
  body { background: #0d1117; color: #e6edf3; font-family: 'Segoe UI', system-ui, sans-serif; }
  .hero { background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%); padding: 2.5rem 0 2rem; }
  .nav-link-btn { background: #21262d; border: 1px solid #30363d; border-radius: 8px; padding: .4rem 1rem; color: #58a6ff; text-decoration: none; font-size: .9rem; }
  .nav-link-btn:hover { background: #2d333b; color: #79c0ff; }
  .live-badge { background: #3fb95022; color: #3fb950; border: 1px solid #3fb95055; border-radius: 6px; padding: 2px 10px; font-size: .8rem; }
  .wait-card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 3rem 2rem; text-align: center; }
  a { color: #58a6ff; }
</style>
</head>
<body>

<div class="hero text-white">
  <div class="container">
    <div class="row align-items-center mb-3">
      <div class="col">
        <div class="d-flex align-items-center gap-3 mb-1">
          <h1 class="fw-bold mb-0">⚡ ライブダッシュボード</h1>
          <span class="live-badge">LIVE</span>
        </div>
        <p class="opacity-75 mb-0">毎時更新 — 初回データ収集をお待ちください</p>
      </div>
      <div class="col-auto">
        <a href="index.html" class="nav-link-btn">📊 日次レポートへ →</a>
      </div>
    </div>
  </div>
</div>

<div class="container py-5">
  <div class="wait-card">
    <div style="font-size:3rem; margin-bottom:1rem;">⏳</div>
    <h3 style="color:#f0f6fc;">データ収集中...</h3>
    <p class="text-muted mt-2">次回の毎時ワークフロー実行後に自動で更新されます。<br>このページは5分ごとに自動リロードされます。</p>
    <a href="index.html" class="nav-link-btn mt-3 d-inline-block">📊 日次レポートを見る</a>
  </div>
</div>

<footer class="text-center py-3" style="color:#8b949e; border-top: 1px solid #30363d;">
  <small><a href="index.html">日次レポート</a></small>
</footer>
</body>
</html>
