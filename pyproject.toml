[project]
name = "youtube-analytics"
version = "0.1.0"
description = "YouTube Channel Analytics and AI Report System for 空想ロマンス"
requires-python = ">=3.12"
dependencies = [
    "google-api-python-client>=2.150.0",
    "pandas>=2.2.0",
    "matplotlib>=3.8.0",
    "jinja2>=3.1.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "openai>=1.40.0",
    "anthropic>=0.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/youtube_analytics"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "ANN", "B", "C4", "RET", "SIM"]
ignore = [
    "ANN101", "ANN102",
    "ANN401",   # Any is needed for YouTube API client responses
    "UP045",    # Optional[X] vs X | None — stylistic
    "UP017",    # datetime.UTC alias — stylistic
    "UP035",    # collections.abc imports — stylistic
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=src/youtube_analytics --cov-report=term-missing -v"

[tool.coverage.run]
source = ["src/youtube_analytics"]
omit = ["tests/*"]
